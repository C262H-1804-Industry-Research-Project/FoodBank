openapi: "3.0.2"
info:
  title: Second Table API
  version: "1.0"
  description: >-
    REST API for the Second Table food-rescue platform. Donors publish listings with pickup
    timeslots, recipients request pickups, and admins moderate reports, accounts and listings.
    Errors are returned as {"error": "<message>"}.
servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registration, login and logout
  - name: account
    description: Adding, linking and switching between donor and recipient roles
  - name: listings
    description: Public browsing and search
  - name: listing-catalogue
    description: Categories, tags and food name suggestions
  - name: donor
    description: A donor's own listings and settings
  - name: uploads
    description: Listing and evidence photos
  - name: recipient-location
    description: Saved location used for listing distances
  - name: recipient-request
    description: Pickup requests made by the signed-in recipient
  - name: donor-request
    description: Pickup requests received by a donor
  - name: collection-history
  - name: reports
    description: Reports filed by donors and recipients
  - name: admin

paths:
  # ---------- Authentication ----------
  /api/auth/register-donors:
    post:
      tags: [auth]
      summary: Register a donor account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDonorRequest' }
      responses:
        '201':
          description: Donor account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonorResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already registered }
  /api/auth/register-recipients:
    post:
      tags: [auth]
      summary: Register a recipient account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipientRegisterRequest' }
      responses:
        '200':
          description: Recipient account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already registered }
  /api/auth/register-both:
    post:
      tags: [auth]
      summary: Register one account with both donor and recipient profiles
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DualRoleRegisterRequest' }
      responses:
        '201':
          description: Account created with both profiles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DualRoleRegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already registered }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in as a donor, recipient or admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid email or password }
        '403': { description: Account is banned, or the profile is not approved }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Log out and revoke the current token
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------- Account roles ----------
  /api/account/add-role:
    post:
      tags: [account]
      summary: Add a donor or recipient profile to the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddRoleRequest' }
      responses:
        '200':
          description: Profile added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddRoleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Account is banned }
        '409': { description: The account already has that role, or is linked to another account }
  /api/account/switch-role:
    post:
      tags: [account]
      summary: Switch to the account's other role and receive a new token
      description: The current token is revoked and a new one is issued for the target role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchRoleRequest' }
      responses:
        '200':
          description: New token for the target role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Account is banned, or has no approved profile for the target role }
  /api/account/link:
    post:
      tags: [account]
      summary: Link a separate existing account of the other role into this one
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkAccountRequest' }
      responses:
        '200':
          description: Accounts linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Missing token, or wrong email or password for the other account }
        '403': { description: Either account is banned }
        '409': { description: Either account already has both roles or is already linked }

  # ---------- Browsing ----------
  /api/listings:
    get:
      tags: [listings]
      summary: Browse and search live listings
      security: []
      parameters:
        - name: foodName
          in: query
          schema: { type: string }
          description: Case-insensitive partial match against the food name.
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: tagIds
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer }
          description: Repeated tag ID parameter. A listing with any selected tag matches.
        - name: suburbs
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, example: Glenelg|SA }
          description: >-
            Repeated suburb parameter, each "Suburb|STATE" (or just "Suburb" to match any state).
            Case-insensitive. A listing in any selected suburb matches.
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
          description: >-
            The recipient's latitude. Must be sent with longitude. Results are then sorted
            nearest-first (listings without coordinates last) and include distanceKm.
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
          description: >-
            The recipient's longitude. Must be sent with latitude. If both are omitted and the
            caller is a signed-in recipient, their saved location (/api/recipients/me/location) is used.
        - { $ref: '#/components/parameters/Page' }
        - name: size
          in: query
          schema: { type: integer, default: 10, minimum: 1 }
      responses:
        '200':
          description: >-
            A page of listings. Each listing includes availableQuantity (quantity not held by
            pending, approved, completed or expired requests); fully reserved listings are still
            returned with availableQuantity 0.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/listings/categories:
    get:
      tags: [listing-catalogue]
      summary: List listing categories
      security: []
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogueItemResponse' }
  /api/listings/tags:
    get:
      tags: [listing-catalogue]
      summary: List listing tags
      security: []
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogueItemResponse' }
  /api/suggestions/foodnames:
    get:
      tags: [listing-catalogue]
      summary: Suggest food names for the search box
      security: []
      parameters:
        - { name: query, in: query, schema: { type: string } }
      responses:
        '200':
          description: Matching food names
          content:
            application/json:
              schema: { type: array, items: { type: string } }

  # ---------- Donor listings and settings ----------
  /api/donors/{donorId}/listings:
    parameters:
      - { $ref: '#/components/parameters/DonorId' }
    get:
      tags: [donor]
      summary: Get one page of your own listings, newest first
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - name: size
          in: query
          schema: { type: integer, default: 5, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: A page of the donor's listings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyListingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account }
    post:
      tags: [donor]
      summary: Create a listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListingRequest' }
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedListingResponse' }
        '400':
          description: Invalid listing data, or a LIVE listing with no pickup timeslot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Donor not found }
  /api/donors/{donorId}/listings/{listingId}:
    parameters:
      - { $ref: '#/components/parameters/DonorId' }
      - { name: listingId, in: path, required: true, schema: { type: integer } }
    put:
      tags: [donor]
      summary: Replace one of your listings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateListingRequest' }
      responses:
        '200':
          description: Listing updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyListingResponse' }
        '400':
          description: Invalid listing data, or a LIVE listing with no pickup timeslot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account }
        '404': { description: Listing not found for donor }
        '409': { description: Booked timeslots removed, capacity below bookings, or quantity below reserved stock }
    delete:
      tags: [donor]
      summary: Delete one of your listings
      responses:
        '204': { description: Listing deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account }
        '404': { description: Listing not found for donor }
  /api/donors/{donorId}/settings:
    parameters:
      - { $ref: '#/components/parameters/DonorId' }
    get:
      tags: [donor]
      summary: Read your donor settings
      responses:
        '200':
          description: Donor settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonorSettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account }
    put:
      tags: [donor]
      summary: Update your donor settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDonorSettingsRequest' }
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonorSettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account }

  # ---------- Uploads ----------
  /api/uploads/photo:
    post:
      tags: [uploads]
      summary: Upload a photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Photo stored; use the returned URL as photoUrl or evidenceImageUrl
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: /uploads/3f2c9a1e-....jpg }
        '400': { description: File is empty }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/uploads/photo/{filename}:
    get:
      tags: [uploads]
      summary: Download an uploaded photo
      description: Uploaded photos are also served without authentication at /uploads/{filename}.
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        '404': { description: Photo not found }

  # ---------- Recipient location ----------
  /api/recipients/me/location:
    get:
      tags: [recipient-location]
      summary: Get the signed-in recipient's saved location
      responses:
        '200':
          description: Saved location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientLocation' }
        '204': { description: No location saved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a recipient }
    put:
      tags: [recipient-location]
      summary: Save the signed-in recipient's location
      description: >-
        Used to show distance to listings. If latitude/longitude are omitted the server tries
        to geocode the address; they stay null if that fails.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipientLocation' }
      responses:
        '200':
          description: Location saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientLocation' }
        '400': { description: No addressLine or suburb, only one coordinate, or coordinates out of range }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a recipient }
    delete:
      tags: [recipient-location]
      summary: Clear the signed-in recipient's saved location
      responses:
        '204': { description: Location cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a recipient }

  # ---------- Pickup requests (recipient) ----------
  /api/requests:
    post:
      tags: [recipient-request]
      summary: Submit a pickup request for a timeslot as the signed-in recipient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestSubmission' }
      responses:
        '201':
          description: Request created (PENDING, or APPROVED if the listing auto-approves)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestResponse' }
        '400': { description: Missing fields, non-positive quantity, note too long, or daily limit exceeded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a recipient }
        '404': { description: Timeslot not found }
        '409':
          description: >-
            Listing not live or fully reserved, quantity above what is left, timeslot fully booked,
            bookings closed (30 minutes before the timeslot ends), or recipient already requested this timeslot
    get:
      tags: [recipient-request]
      summary: Get the signed-in recipient's pickup requests
      responses:
        '200':
          description: Recipient's requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RequestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a recipient }
  /api/requests/reportable:
    get:
      tags: [recipient-request, reports]
      summary: List the signed-in recipient's requests that can be reported
      description: Requests that are APPROVED, COMPLETED or EXPIRED.
      responses:
        '200':
          description: Reportable requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecipientReportableRequestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a recipient }
  /api/requests/{requestId}:
    delete:
      tags: [recipient-request]
      summary: Cancel your own PENDING or APPROVED request before pickup starts
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Cancelled; pickup place restored }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your recipient request }
        '404': { description: Request not found }
        '409': { description: Request inactive or pickup has started }

  # ---------- Pickup requests (donor) ----------
  /api/donors/{donorId}/requests:
    get:
      tags: [donor-request]
      summary: Read all requests for your donor account
      parameters:
        - { $ref: '#/components/parameters/DonorId' }
      responses:
        '200':
          description: All donor requests; clients may filter by status
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RequestResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account }
        '404': { description: Donor not found }
  /api/donors/{donorId}/requests/reportable:
    get:
      tags: [donor-request, reports]
      summary: List requests on your listings that can be reported
      description: Requests that are APPROVED, COMPLETED or EXPIRED.
      parameters:
        - { $ref: '#/components/parameters/DonorId' }
      responses:
        '200':
          description: Reportable requests
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportableRequestResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account }
  /api/donors/{donorId}/requests/{requestId}/approve:
    patch:
      tags: [donor-request]
      summary: Approve a pending request belonging to your donor account
      parameters:
        - { $ref: '#/components/parameters/DonorId' }
        - { name: requestId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Updated request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account or request }
        '404': { description: Donor or request not found }
        '409': { description: Request has already been processed or cancelled, or the pickup slot has ended }
  /api/donors/{donorId}/requests/{requestId}/reject:
    patch:
      tags: [donor-request]
      summary: Reject a pending request belonging to your donor account
      parameters:
        - { $ref: '#/components/parameters/DonorId' }
        - { name: requestId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Updated request and pickup place restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account or request }
        '404': { description: Donor or request not found }
        '409': { description: Request has already been processed or cancelled, or the pickup slot has ended }
  /api/donors/{donorId}/requests/{requestId}/complete:
    patch:
      tags: [donor-request]
      summary: >-
        Confirm handover of an approved request (up to its handoverDeadline), or correct an expired
        request to COMPLETED before its stock is released
      parameters:
        - { $ref: '#/components/parameters/DonorId' }
        - { name: requestId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Request marked COMPLETED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account or request }
        '404': { description: Donor or request not found }
        '409':
          description: >-
            Request is not approved or expired, an approved request is past its handover deadline,
            or an expired request's stock has already been released

  # ---------- Collection history ----------
  /api/donors/{donorId}/collection-history:
    get:
      tags: [collection-history]
      summary: Read completed collections from your listings
      parameters:
        - { $ref: '#/components/parameters/DonorId' }
      responses:
        '200':
          description: Collection history
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CollectionHistoryResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account }
  /api/recipients/me/collection-history:
    get:
      tags: [collection-history]
      summary: Get one page of the signed-in recipient's collections
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - name: size
          in: query
          schema: { type: integer, default: 5, minimum: 1 }
      responses:
        '200':
          description: A page of collection history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientCollectionHistoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a recipient }

  # ---------- Reports ----------
  /api/reports:
    post:
      tags: [reports]
      summary: Report a pickup
      description: >-
        Recipients may file only FOOD_QUALITY reports and donors only RECIPIENT_BEHAVIOUR reports,
        against a pickup request that is APPROVED, COMPLETED or EXPIRED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201':
          description: Report submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Report type not allowed for the caller's role, or the pickup request is not theirs or not for this listing }
        '404': { description: Listing or pickup request not found }
        '409': { description: Pickup request is not APPROVED, COMPLETED or EXPIRED }
  /api/reports/statuses:
    get:
      tags: [reports]
      summary: List report status codes
      responses:
        '200':
          description: Status codes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/recipients/me/reports:
    get:
      tags: [reports]
      summary: Get one page of the signed-in recipient's reports, newest first
      parameters:
        - { $ref: '#/components/parameters/ReportStatusFilter' }
        - name: q
          in: query
          schema: { type: string }
          description: Matches the listing, donor, reason or details.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size10' }
      responses:
        '200':
          description: A page of reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientReportPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a recipient }
  /api/donors/{donorId}/reports:
    get:
      tags: [reports]
      summary: Get one page of reports filed by your donor account, newest first
      parameters:
        - { $ref: '#/components/parameters/DonorId' }
        - { $ref: '#/components/parameters/ReportStatusFilter' }
        - name: q
          in: query
          schema: { type: string }
          description: Matches the listing, recipient, reason or details.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size10' }
      responses:
        '200':
          description: A page of reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonorReportPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not your donor account }

  # ---------- Admin ----------
  /api/admin/accounts:
    get:
      tags: [admin]
      summary: Search donor and recipient accounts with activity and ban statistics
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [DONOR, RECIPIENT] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, UNDER_REVIEW, BANNED] } }
        - name: q
          in: query
          schema: { type: string }
          description: Matches the user ID, name, email or suburb.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size10' }
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /api/donors:
    get:
      tags: [admin]
      summary: List all donor accounts with statistics
      responses:
        '200':
          description: Donor accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminDonorAccountResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /api/recipients:
    get:
      tags: [admin]
      summary: List all recipient accounts with statistics
      responses:
        '200':
          description: Recipient accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminRecipientAccountResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /api/admin/users/{userId}/ban:
    post:
      tags: [admin]
      summary: Ban a user temporarily or permanently
      description: The user's active tokens are revoked.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BanUserRequest' }
      responses:
        '201':
          description: Ban recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Admin role required, or the report is not against this user }
        '404': { description: User or report not found }
        '409': { description: User already banned }
  /api/admin/users/{userId}/unban:
    post:
      tags: [admin]
      summary: Lift a user's active ban
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: User reactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnbanUserResponse' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { description: User not found }
        '409': { description: User is not banned }
  /api/admin/listings:
    get:
      tags: [admin]
      summary: List all listings, including drafts and banned listings
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: A page of listings with status, quantity and request counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /api/admin/listings/{listingId}/ban:
    post:
      tags: [admin]
      summary: Set a listing's status to BANNED without deleting it
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Listing banned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanListingResponse' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { description: Listing not found }
        '409': { description: Listing already banned }
  /api/admin/reports:
    get:
      tags: [admin]
      summary: List all reports with names and prior ban count
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminReportResponse' } }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /api/admin/reports/{reportId}:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [admin]
      summary: View report details
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReportResponse' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { description: Report not found }
    patch:
      tags: [admin]
      summary: Process a report and optionally apply a user ban atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessReportRequest' }
      responses:
        '200':
          description: Updated report with processing metadata and ban count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReportResponse' }
        '400': { description: Invalid status, action or duration }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { description: Report or reported user not found }
        '409': { description: Report already processed or user already banned }
  /api/admin/admins:
    post:
      tags: [admin]
      summary: Create another admin account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminRequest' }
      responses:
        '201':
          description: Admin created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminOnly' }
  /api/settings/ban-days:
    get:
      tags: [admin]
      summary: Read the default ban durations
      responses:
        '200':
          description: Durations in days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanDays' }
        '403': { $ref: '#/components/responses/AdminOnly' }
    put:
      tags: [admin]
      summary: Save the default ban durations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BanDays' }
      responses:
        '200':
          description: Saved durations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanDays' }
        '400': { description: Invalid duration }
        '403': { $ref: '#/components/responses/AdminOnly' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DonorId:
      name: donorId
      in: path
      required: true
      schema: { type: integer }
      description: Must be the signed-in donor's own donorId.
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Size10:
      name: size
      in: query
      schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
    ReportStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/ReportStatus' }

  responses:
    BadRequest:
      description: Missing or invalid fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid or revoked JWT
    AdminOnly:
      description: Admin role required

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
    MessageResponse:
      type: object
      properties:
        message: { type: string }
    PageMetadata:
      type: object
      properties:
        size: { type: integer }
        number: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ReportStatus:
      type: string
      enum: [PENDING, IN_REVIEW, RESOLVED, DISMISSED]

    # Authentication and accounts
    LoginRequest:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email, example: user@example.com }
        password: { type: string, format: password, example: Password123! }
        role: { type: string, enum: [donor, recipient, admin] }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        user: { $ref: '#/components/schemas/LoginUserResponse' }
    LoginUserResponse:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [donor, recipient, admin] }
        donorId: { type: integer, nullable: true }
    CreateDonorRequest:
      type: object
      required: [email, password, orgName, addressLine, suburb, region]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        phone: { type: string }
        orgName: { type: string, example: Green Leaf Café }
        addressLine: { type: string, example: 123 Example Street }
        suburb: { type: string, example: Adelaide }
        region: { type: string, example: SA }
    DonorResponse:
      type: object
      properties:
        donorId: { type: integer }
        userId: { type: integer }
        email: { type: string, format: email }
        orgName: { type: string }
        addressLine: { type: string }
        suburb: { type: string }
        region: { type: string }
        approvalStatus: { type: string }
        hideContact: { type: boolean }
    RecipientRegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        phone: { type: string }
        orgName: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
    RecipientResponse:
      type: object
      properties:
        recipientId: { type: integer }
        userId: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        approvalStatus: { type: string }
    DualRoleRegisterRequest:
      type: object
      required: [email, password, donorOrgName, addressLine, suburb, region, recipientName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        phone: { type: string }
        donorOrgName: { type: string }
        addressLine: { type: string }
        suburb: { type: string }
        region: { type: string }
        recipientName: { type: string }
        recipientOrgName: { type: string }
    DualRoleRegisterResponse:
      type: object
      properties:
        userId: { type: integer }
        donorId: { type: integer }
        recipientId: { type: integer }
        email: { type: string, format: email }
        donorApprovalStatus: { type: string }
        recipientApprovalStatus: { type: string }
    AddRoleRequest:
      type: object
      required: [targetRole]
      description: Send the donor fields when adding donor, or the recipient fields when adding recipient.
      properties:
        targetRole: { type: string, enum: [donor, recipient] }
        donorOrgName: { type: string }
        addressLine: { type: string }
        suburb: { type: string }
        region: { type: string }
        recipientName: { type: string }
        recipientOrgName: { type: string }
    AddRoleResponse:
      type: object
      properties:
        message: { type: string }
        role: { type: string }
        profileId: { type: integer }
    SwitchRoleRequest:
      type: object
      required: [targetRole]
      properties:
        targetRole: { type: string, enum: [donor, recipient] }
    LinkAccountRequest:
      type: object
      required: [targetRole, email, password]
      description: Email and password of the other account to link.
      properties:
        targetRole: { type: string, enum: [donor, recipient] }
        email: { type: string, format: email }
        password: { type: string, format: password }
    LinkAccountResponse:
      type: object
      properties:
        message: { type: string }
        role: { type: string }

    # Listings
    CatalogueItemResponse:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    TimeSlot:
      type: object
      properties:
        timeslotId: { type: integer }
        startTime: { type: string }
        endTime: { type: string }
        remainingSlot: { type: integer }
        maxRecipients: { type: integer }
    ListingResponse:
      type: object
      properties:
        listingId: { type: integer }
        foodName: { type: string }
        description: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true }
        category: { type: string }
        expiryDate: { type: string, nullable: true }
        maxDailyCapacity: { type: integer, nullable: true }
        latestCollectionDate: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        timeslots: { type: array, items: { $ref: '#/components/schemas/TimeSlot' } }
        donorName: { type: string }
        suburb: { type: string }
        region: { type: string }
        distanceKm:
          type: number
          nullable: true
          description: Set only when a location was given or saved and the listing has coordinates
        availableQuantity: { type: number, format: float }
    ListingPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/ListingResponse' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    CreateTimeslotRequest:
      type: object
      required: [startTime, endTime, maxRecipients]
      description: Start and end must be on the same date, with end after start.
      properties:
        startTime: { type: string, format: date-time, example: '2099-01-01T10:00' }
        endTime: { type: string, format: date-time, example: '2099-01-01T11:00' }
        maxRecipients: { type: integer, minimum: 1 }
    CreateListingRequest:
      type: object
      required: [name, categoryId, quantity, isAutoApproved, usePickupCode]
      properties:
        name: { type: string, example: Mixed vegetable crates }
        description: { type: string }
        categoryId: { type: integer, example: 1 }
        quantity: { type: number, format: float, example: 8 }
        expiryDate: { type: string, format: date }
        collectionDeadline: { type: string, format: date }
        addressLine: { type: string, example: 123 Example Street }
        suburb: { type: string, example: Adelaide }
        region: { type: string, example: SA }
        maxDailyCapacity: { type: integer, description: Most one recipient can request per day }
        photoUrl: { type: string, description: URL returned by POST /api/uploads/photo }
        tagIds: { type: array, items: { type: integer } }
        timeslots:
          type: array
          items: { $ref: '#/components/schemas/CreateTimeslotRequest' }
          description: At least one is required when status is LIVE
        isAutoApproved: { type: boolean }
        usePickupCode: { type: boolean }
        status: { type: string, enum: [LIVE, DRAFT], default: LIVE }
    UpdateListingRequest:
      allOf:
        - $ref: '#/components/schemas/CreateListingRequest'
        - type: object
          properties:
            slotCapacity: { type: integer, nullable: true }
            hideContact: { type: boolean, nullable: true }
    CreatedListingResponse:
      type: object
      properties:
        listingId: { type: integer }
        donorId: { type: integer }
        status: { type: string, example: LIVE }
    MyListingResponse:
      type: object
      properties:
        listingId: { type: integer }
        name: { type: string }
        category: { type: string }
        categoryId: { type: integer }
        description: { type: string, nullable: true }
        quantity: { type: number, format: float }
        status: { type: string, example: LIVE }
        expiryDate: { type: string, format: date, nullable: true }
        collectionDeadline: { type: string, format: date, nullable: true }
        maxDailyCapacity: { type: integer, nullable: true }
        photoUrl: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        timeslots: { type: array, items: { $ref: '#/components/schemas/TimeSlot' } }
        addressLine: { type: string }
        suburb: { type: string }
        region: { type: string }
        isAutoApproved: { type: boolean }
        usePickupCode: { type: boolean }
        hideContact: { type: boolean }
        slotCapacity: { type: integer, nullable: true }
        completedRequests: { type: integer, description: Used for the collection rate }
        approvedRequests: { type: integer, description: Used for the collection rate }
        availableQuantity:
          type: number
          format: float
          description: Quantity not held by pending, approved, completed or expired requests
    MyListingPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/MyListingResponse' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    DonorSettingsResponse:
      type: object
      properties:
        donorId: { type: integer }
        hideContact: { type: boolean }
        addressLine: { type: string }
        suburb: { type: string }
        region: { type: string }
    UpdateDonorSettingsRequest:
      type: object
      properties:
        hideContact: { type: boolean }
    RecipientLocation:
      type: object
      description: At least one of addressLine or suburb is required.
      properties:
        addressLine: { type: string, nullable: true, example: 1 King William St }
        suburb: { type: string, nullable: true, example: Adelaide }
        region: { type: string, nullable: true, example: SA }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90, example: -34.9285 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180, example: 138.6007 }

    # Pickup requests and history
    RequestSubmission:
      type: object
      description: The recipient is taken from the bearer token, not the body.
      required: [timeslotId, quantityRequested]
      properties:
        timeslotId: { type: integer }
        quantityRequested: { type: number, format: float, minimum: 0, exclusiveMinimum: true, example: 2 }
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Optional message to the donor. Trimmed; blank is stored as null.
          example: Will arrive a bit late
    RequestResponse:
      type: object
      properties:
        requestId: { type: integer }
        recipientName: { type: string }
        listingName: { type: string }
        timeslotStart: { type: string }
        timeslotEnd: { type: string }
        quantityRequested: { type: number, format: float }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED, COMPLETED, EXPIRED] }
        pickupCode: { type: string, nullable: true }
        note: { type: string, nullable: true }
        donorName: { type: string }
        pickupAddress:
          type: string
          nullable: true
          description: Exact address; returned only when the request is APPROVED
        recipientOrg: { type: string, nullable: true }
        recipientPhone: { type: string, nullable: true }
        listingQuantity: { type: number, format: float, nullable: true }
        availableQuantity: { type: number, format: float, description: What is left of the listing }
        handoverDeadline:
          type: string
          nullable: true
          description: Slot end plus the handover grace period (15 minutes by default); set only for APPROVED or EXPIRED requests
        rejectionReason:
          type: string
          nullable: true
          enum: [DECLINED_BY_DONOR, NOT_REVIEWED_IN_TIME]
          description: Set only when status is REJECTED
        stockReleased:
          type: boolean
          description: >-
            True once the daily release (00:20 Adelaide time, plus once on server startup) has
            stopped this EXPIRED request holding listing stock. Only requests whose slot ended by
            midnight are released; the request stays EXPIRED
    ReportableRequestResponse:
      type: object
      properties:
        requestId: { type: integer }
        listingId: { type: integer }
        listingName: { type: string }
        timeslotId: { type: integer }
        timeslotStart: { type: string }
        timeslotEnd: { type: string }
        recipientUserId: { type: integer }
        recipientName: { type: string }
        quantityRequested: { type: number, format: float }
    RecipientReportableRequestResponse:
      type: object
      properties:
        requestId: { type: integer }
        listingId: { type: integer }
        listingName: { type: string }
        donorName: { type: string }
        timeslotStart: { type: string }
        timeslotEnd: { type: string }
        quantityRequested: { type: number, format: float }
    CollectionHistoryResponse:
      type: object
      properties:
        historyId: { type: integer }
        category: { type: string }
        quantityCollected: { type: number, format: float }
        collectedDatetime: { type: string }
        recipientName: { type: string }
        pickupLocation: { type: string }
        foodName: { type: string }
        status: { type: string }
    RecipientCollectionHistoryResponse:
      type: object
      properties:
        historyId: { type: integer }
        requestId: { type: integer }
        listingId: { type: integer }
        foodName: { type: string }
        category: { type: string }
        quantityCollected: { type: number, format: float }
        donorName: { type: string }
        collectedDatetime: { type: string }
        pickupLocation: { type: string }
    RecipientCollectionHistoryPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/RecipientCollectionHistoryResponse' } }
        page: { $ref: '#/components/schemas/PageMetadata' }

    # Reports
    CreateReportRequest:
      type: object
      required: [reportType, listingId, pickupRequestId, reason]
      properties:
        reportType: { type: string, enum: [FOOD_QUALITY, RECIPIENT_BEHAVIOUR] }
        listingId: { type: integer }
        pickupRequestId: { type: integer }
        reportedUserId: { type: integer, nullable: true }
        reason: { type: string }
        details: { type: string, nullable: true }
        evidenceImageUrl: { type: string, nullable: true, description: URL returned by POST /api/uploads/photo }
        actualTransactionTime: { type: string, format: date-time, nullable: true }
    CreatedReportResponse:
      type: object
      properties:
        message: { type: string }
        reportId: { type: integer }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }
    RecipientReportResponse:
      type: object
      properties:
        reportId: { type: integer }
        listingId: { type: integer }
        pickupRequestId: { type: integer }
        reason: { type: string }
        details: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ReportStatus' }
        outcome: { type: string, nullable: true }
        processedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        listingName: { type: string }
        donorName: { type: string }
        timeslotStart: { type: string, format: date-time }
        timeslotEnd: { type: string, format: date-time }
        evidenceImageUrl: { type: string, nullable: true }
    RecipientReportPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/RecipientReportResponse' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    DonorReportResponse:
      type: object
      properties:
        reportId: { type: integer }
        reportedId: { type: integer }
        listingId: { type: integer }
        pickupRequestId: { type: integer }
        reportType: { type: string }
        reason: { type: string }
        details: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ReportStatus' }
        outcome: { type: string, nullable: true }
        processedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        listingName: { type: string }
        reportedName: { type: string }
        timeslotStart: { type: string, format: date-time }
        timeslotEnd: { type: string, format: date-time }
        evidenceImageUrl: { type: string, nullable: true }
        actualTransactionTime: { type: string, format: date-time, nullable: true }
    DonorReportPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/DonorReportResponse' } }
        page: { $ref: '#/components/schemas/PageMetadata' }

    # Admin
    AdminAccountResponse:
      type: object
      properties:
        userId: { type: integer }
        role: { type: string, enum: [DONOR, RECIPIENT] }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        suburb: { type: string, nullable: true }
        region: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, UNDER_REVIEW, BANNED] }
        reportsAgainst: { type: integer }
        activityCount: { type: integer }
        successfulCollections: { type: integer }
        banTimes: { type: integer }
        banDaysRemaining: { type: integer, nullable: true }
        totalRequests: { type: integer }
        completedCollections: { type: integer }
    AdminAccountPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AdminAccountResponse' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    AdminDonorAccountResponse:
      type: object
      properties:
        donorId: { type: integer }
        userId: { type: integer }
        organisation: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        suburb: { type: string }
