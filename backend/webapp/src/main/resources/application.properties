spring.application.name=webapp

spring.datasource.url=jdbc:mysql://localhost:3306/foodbankdb
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mapbox token for looking up pickup point coordinates (server-side only; not URL-restricted).
mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}

# Minutes after a pickup slot ends that a donor can still confirm the handover.
pickup.handover-grace-minutes=${HANDOVER_GRACE_MINUTES:15}

# Default admin account, created on startup if it does not exist yet.
# Leave admin.default.email blank to turn this off.
admin.default.name=${DEFAULT_ADMIN_NAME:admin}
admin.default.email=${DEFAULT_ADMIN_EMAIL:admin@test.com}
admin.default.password=${DEFAULT_ADMIN_PASSWORD:password}
