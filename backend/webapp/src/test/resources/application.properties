spring.application.name=webapp

# In-memory database so tests run without MySQL (locally and in CI).
# Each test context gets its own database, so contexts with different settings
# (e.g. a fake Mapbox server) cannot drop each other's tables.
# NON_KEYWORDS lets H2 accept the "user" table name.
spring.datasource.url=jdbc:h2:mem:foodbank-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only signing key (base64), never used outside tests.
JWT_SECRET=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci1mb29kYmFuay0xMjM0NTY3OA==

# Address lookups are disabled in tests so they never call Mapbox.
mapbox.access-token=

# Default admin account, created on startup if it does not exist yet.
# Leave admin.default.email blank to turn this off.
admin.default.name=${DEFAULT_ADMIN_NAME:admin}
admin.default.email=${DEFAULT_ADMIN_EMAIL:admin@test.com}
admin.default.password=${DEFAULT_ADMIN_PASSWORD:password}
